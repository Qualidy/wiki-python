title: "Zugriff wie bei Listen (Fortsetzung)"
difficulty: 3
question: |
  Sorge nun mit den richtigen Methoden dafür, dass es möglich ist auf den `x`-Wert über den Index `0` oder `-2`
  erreichbar ist und dass der `y`-Wert über den Index `1` oder `-1` erreichbar ist. Die folgenden Tests
  sollen grün werden:

  ```python
      def test_read_0(self):
          a = Punkt(2, 1)
          self.assertEqual(2, a[0])

      def test_read_1(self):
          a = Punkt(2, 1)
          self.assertEqual(1, a[1])

      def test_read_2(self):
          a = Punkt(2, 1)
          with self.assertRaises(IndexError):
              b = a[2]

      def test_read_4(self):
          a = Punkt(2, 1)
          self.assertEqual(2, a[-2])

      def test_read_5(self):
          a = Punkt(2, 1)
          self.assertEqual(1, a[-1])

      def test_read_6(self):
          a = Punkt(2, 1)
          with self.assertRaises(IndexError):
              b = a[-3]

      def test_set_0(self):
          a = Punkt(2, 1)
          a[0] = 0
          self.assertEqual(a, Punkt(0,1))

      def test_set_1(self):
          a = Punkt(2, 1)
          a[1] = 0
          self.assertEqual(a, Punkt(2,0))

      def test_set_2(self):
          a = Punkt(2, 1)
          with self.assertRaises(IndexError):
              a[3] = 4

      def test_set_4(self):
          a = Punkt(2, 1)
          a[-1] = 0
          self.assertEqual(a, Punkt(2, 0))

      def test_set_5(self):
          a = Punkt(2, 1)
          a[-2] = 0
          self.assertEqual(a, Punkt(0,1))

      def test_set_6(self):
          a = Punkt(2, 1)
          with self.assertRaises(IndexError):
              a[-3] = 4
  ```

  Ganz schön viele Tests, wa? 😉

  {{ youtube_video("https://www.youtube.com/embed/9grwdOYmjSo?si=fkbyyrGxp4ANYy1z") }}

solution: |
  ```python
  def __getitem__(self, item):
      if item in [0, -2]:
          return self.x
      elif item in [1, -1]:
          return self.y
      else:
          raise IndexError("Index muss 0 für x oder 1 für y sein.")

  def __setitem__(self, key, value):
      if key in [0, -2]:
          self.x = value
      elif key in [1, -1]:
          self.y = value
      else:
          raise IndexError("Index muss 0 für x oder 1 für y sein.")
  ```
