title: "Minimalversion implementieren"
difficulty: 3
question: |
  Implementiere eine Minimalversion deines Ticket-System Backends ohne Menü
  und ohne Frontend.

  Anforderungen:

  - mindestens 4 Klassen aus deiner Planung
  - ein kurzer Demo-Ablauf am Ende der Datei
  - mindestens eine Vererbungsbeziehung
  - mindestens eine überschriebene Methode
  - mindestens eine `__str__`-Methode
  - eine Debug-Funktion mit `__dict__` und `__class__.__name__`
  - Methoden sollen Werte zurückgeben, nicht nur `print()` verwenden

  Das Programm darf zunächst feste Beispielobjekte verwenden. Es muss noch
  keine vollständige Benutzereingabe besitzen.
tip: |
  Starte klein: Erst Konstruktoren, Attribute und einen Demo-Ablauf bauen,
  danach Vererbung, `__str__` und Debug-Funktion ergänzen. Wenn du die gleiche
  Methode für unterschiedliche Ticketarten aufrufen kannst, ohne den konkreten
  Typ vorher abzufragen, bist du nah an Polymorphismus.
