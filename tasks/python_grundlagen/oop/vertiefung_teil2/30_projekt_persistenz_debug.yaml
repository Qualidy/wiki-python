title: "Ticket-System: Speichern und Debuggen"
difficulty: 3
question: |
  Ergänze dein Ticket-System um zwei Bausteine:

  1. `save_tickets(filename, tickets)` speichert Tickets in eine JSON-Datei.
  2. `debug_object(obj)` gibt Klasse, Attribute und Oberklassen aus.

  Wichtig: Speichere nicht die Python-Objekte direkt, sondern Dictionaries,
  z.B. über eine Methode `to_dict()`.
tip: |
  JSON kann einfache Datentypen speichern, aber keine Python-Objekte direkt.
  Baue deshalb zuerst eine saubere Umwandlung deiner Objekte in Dictionaries.
  Die Debug-Funktion soll mit verschiedenen Objektarten funktionieren.
