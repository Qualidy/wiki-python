title: "PCAP Probetest 1"
description: "Schwachstellen-Probetest: Scope, Listen, Builtins, Generatoren, Dateien, OOP."
questions:
  - type: output
    prompt: "Welche Ausgabe erzeugt der Code?"
    code: |
      x = 10

      def outer():
          x = 20
          def inner():
              return x + 1
          return inner

      f = outer()
      print(f())
    answer: |
      21
    explanation: "inner nutzt x aus dem enclosing scope von outer."
  - type: single
    prompt: "Was ist das Ergebnis von list(range(2, 10, 3))?"
    answer: "range"
    options:
      - label: "[2, 5, 8]"
        value: "range"
      - label: "[2, 3, 4, 5, 6, 7, 8, 9]"
        value: "all"
      - label: "[2, 5, 8, 11]"
        value: "too_far"
  - type: output
    prompt: "Welche Ausgabe erzeugt der Code?"
    code: |
      data = [5, 1, 4, 2]
      result = data.sort()
      print(data)
      print(result)
    answer: |
      [1, 2, 4, 5]
      None
    explanation: "list.sort() sortiert in-place und gibt None zurueck."
  - type: single
    prompt: "Welche Aussage zu sorted(data) ist richtig?"
    answer: "new_list"
    options:
      - label: "sorted(data) gibt eine neue sortierte Liste zurueck."
        value: "new_list"
      - label: "sorted(data) veraendert data immer in-place."
        value: "in_place"
      - label: "sorted(data) funktioniert nur fuer Tupel."
        value: "tuple"
  - type: output
    prompt: "Welche Ausgabe erzeugt der Code?"
    code: |
      print(chr(ord("A") + 3))
    answer: |
      D
  - type: single
    prompt: "Welche Aussage zu bytearray ist richtig?"
    answer: "mutable"
    options:
      - label: "bytearray ist veraenderbar."
        value: "mutable"
      - label: "bytearray erlaubt Werte groesser als 255."
        value: "over_255"
      - label: "bytearray ist dasselbe wie str."
        value: "str"
  - type: output
    prompt: "Welche Ausgabe erzeugt der Code?"
    code: |
      data = bytearray(b"abc")
      data[1] = ord("Z")
      print(data)
    answer: |
      bytearray(b'aZc')
  - type: output
    prompt: "Welche Ausgabe erzeugt der Code?"
    code: |
      values = [1, 2, 3, 4]
      result = filter(lambda x: x % 2 == 0, values)
      print(list(result))
    answer: |
      [2, 4]
  - type: output
    prompt: "Welche Ausgabe erzeugt der Code?"
    code: |
      values = [1, 2, 3]
      result = map(lambda x: x * x, values)
      print(list(result))
    answer: |
      [1, 4, 9]
  - type: output
    prompt: "Welche Ausgabe erzeugt der Code?"
    code: |
      def gen():
          yield 1
          yield 2

      g = gen()
      print(next(g))
      print(list(g))
    answer: |
      1
      [2]
  - type: single
    prompt: "Was passiert, wenn next() auf einem leeren Generator aufgerufen wird?"
    answer: "stop"
    options:
      - label: "StopIteration wird ausgeloest."
        value: "stop"
      - label: "None wird immer zurueckgegeben."
        value: "none"
      - label: "Der Generator startet automatisch neu."
        value: "restart"
  - type: output
    prompt: "Welche Ausgabe erzeugt der Code?"
    code: |
      class A:
          def __init__(self):
              print("A")

      class B(A):
          def __init__(self):
              print("B")
              super().__init__()

      B()
    answer: |
      B
      A
  - type: single
    prompt: "Warum ist self.method() innerhalb einer ueberschriebenen method() oft gefaehrlich?"
    answer: "recursion"
    options:
      - label: "Es kann dieselbe Methode erneut aufrufen und Rekursion erzeugen."
        value: "recursion"
      - label: "Es ruft immer automatisch die Oberklasse auf."
        value: "super"
      - label: "Es loescht self."
        value: "delete"
  - type: output
    prompt: "Welche Ausgabe erzeugt der Code?"
    code: |
      try:
          raise ValueError("x")
      except LookupError:
          print("lookup")
      except ValueError:
          print("value")
    answer: |
      value
  - type: single
    prompt: "Welche Klasse sollte eine eigene Exception normalerweise erben?"
    answer: "exception"
    options:
      - label: "Exception"
        value: "exception"
      - label: "list"
        value: "list"
      - label: "lambda"
        value: "lambda"
  - type: single
    prompt: "Was gibt file.write('abc') typischerweise zurueck?"
    answer: "3"
    options:
      - label: "3"
        value: "3"
      - label: "None"
        value: "none"
      - label: "'abc'"
        value: "abc"
  - type: single
    prompt: "Was macht der Dateimodus 'w'?"
    answer: "overwrite"
    options:
      - label: "Er schreibt und ueberschreibt eine vorhandene Datei."
        value: "overwrite"
      - label: "Er haengt immer nur an."
        value: "append"
      - label: "Er liest binaer."
        value: "binary"
  - type: output
    prompt: "Welche Ausgabe erzeugt der Code?"
    code: |
      nums = [0, 1, 2, 3, 4, 5]
      print(nums[1:5:2])
    answer: |
      [1, 3]
  - type: output
    prompt: "Welche Ausgabe erzeugt der Code?"
    code: |
      a = [1, 2, 3]
      b = a
      b.append(4)
      print(a)
    answer: |
      [1, 2, 3, 4]
  - type: single
    prompt: "Welche Funktion liefert den Unicode-Codepoint eines Zeichens?"
    answer: "ord"
    options:
      - label: "ord()"
        value: "ord"
      - label: "chr()"
        value: "chr"
      - label: "bytearray()"
        value: "bytearray"
