title: "Dunder Methods: `Book`"
difficulty: 2
question: |
  Implementiere eine Klasse `Book`.

  Anforderungen:

  - Konstruktor mit `title`, `author`, `pages`
  - `__str__` gibt z.B. `"Clean Code von Robert C. Martin"` zurueck
  - `__len__` gibt die Seitenzahl zurueck
  - `__eq__` vergleicht Titel und Autor
solution: |
  ```python
  class Book:
      def __init__(self, title, author, pages):
          self.title = title
          self.author = author
          self.pages = pages

      def __str__(self):
          return f"{self.title} von {self.author}"

      def __len__(self):
          return self.pages

      def __eq__(self, other):
          if not isinstance(other, Book):
              return False
          return self.title == other.title and self.author == other.author
  ```
